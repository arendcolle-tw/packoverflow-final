name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:
    inputs:
      source:
        description: Folder to deploy
        default: app
      service:
        description: Cloud Run service name
        default: packoverflow
      min_instances:
        description: Min instances (blank = unchanged)
        required: false
      max_instances:
        description: Max instances (blank = unchanged)
        required: false

env:
  PROJECT_ID: qwiklabs-gcp-04-61c2ca7d9c86
  REGION: us-central1
  WIF_PROVIDER: projects/323892475788/locations/global/workloadIdentityPools/github/providers/github-oidc
  DEPLOY_SA: github-deployer@qwiklabs-gcp-04-61c2ca7d9c86.iam.gserviceaccount.com

concurrency:
  group: deploy-${{ inputs.service || 'packoverflow' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy from source
        # Inputs reach the script only as env vars, never pasted into it, so they cannot inject shell.
        env:
          SOURCE: ${{ inputs.source || 'app' }}
          SERVICE: ${{ inputs.service || 'packoverflow' }}
          MIN_INSTANCES: ${{ inputs.min_instances }}
          MAX_INSTANCES: ${{ inputs.max_instances }}
          # Repository secrets. GitHub masks them in logs; blank ones are skipped so nothing gets wiped.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KG_ADMIN_TOKEN: ${{ secrets.KG_ADMIN_TOKEN }}
        run: |
          [[ "$SERVICE" =~ ^[a-z][a-z0-9-]{0,48}$ ]] || { echo "bad service name"; exit 1; }
          [[ "$SOURCE" =~ ^[A-Za-z0-9_./-]+$ && "$SOURCE" != *..* ]] || { echo "bad source folder"; exit 1; }
          scale=()
          [ -n "$MIN_INSTANCES" ] && scale+=(--min-instances "$MIN_INSTANCES")
          [ -n "$MAX_INSTANCES" ] && scale+=(--max-instances "$MAX_INSTANCES")
          # Env vars per service. Names only here; values come from the env above.
          case "$SERVICE" in
            packoverflow) names=(ELEVENLABS_API_KEY); fixed=(ELEVENLABS_AGENT_ID=agent_8701m5cj7mknehsa9v29b68gqqwm) ;;
            knowledge-graph) names=(ELEVENLABS_API_KEY ANTHROPIC_API_KEY KG_ADMIN_TOKEN); fixed=() ;;
            *) names=(); fixed=() ;;
          esac
          vars=""
          names_set=()
          for kv in "${fixed[@]}"; do vars+="${vars:+@@}$kv"; names_set+=("${kv%%=*}"); done
          for n in "${names[@]}"; do
            if [ -n "${!n}" ]; then vars+="${vars:+@@}$n=${!n}"; names_set+=("$n"); fi
          done
          envflag=()
          # "^@@^" sets @@ as the separator, so a comma inside a value cannot split it.
          if [ -n "$vars" ]; then envflag=(--update-env-vars "^@@^$vars"); echo "Env vars set: ${names_set[*]}"; fi
          gcloud run deploy "$SERVICE" \
            --source "$SOURCE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --allow-unauthenticated --quiet "${scale[@]}" "${envflag[@]}"
      - name: Print URL
        env:
          SERVICE: ${{ inputs.service || 'packoverflow' }}
        run: gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)' | tee -a "$GITHUB_STEP_SUMMARY"
