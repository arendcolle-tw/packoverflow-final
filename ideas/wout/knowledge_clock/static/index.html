<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge clock</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #17171a; --muted: #6b6b73; --line: #e4e2dc;
    --ai: #cfcdc6; --human: #2457d6;
    --dark: #17171a; --single: #c62828; --fading: #b26a00; --healthy: #2e7d32;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 16px 64px; }
  .eyebrow { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 6px; }
  h1 { font-size: clamp(26px, 4vw, 42px); line-height: 1.15; margin: 0 0 10px; font-weight: 700; letter-spacing: -.01em; }
  h1 .human { color: var(--human); }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .topics { display: flex; flex-direction: column; gap: 10px; }
  .topic { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
  .topic:hover, .topic.selected { border-color: var(--ink); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .chip { font-size: 12px; font-weight: 600; color: #fff; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .chip.dark { background: var(--dark); } .chip.single_point { background: var(--single); }
  .chip.fading { background: var(--fading); } .chip.healthy { background: var(--healthy); }
  .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--ai); margin-top: 10px; }
  .bar .h { background: var(--human); }
  .legend { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .detail { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; position: sticky; top: 16px; }
  .detail h2 { margin: 0 0 6px; font-size: 22px; overflow-wrap: anywhere; }
  .explain { margin: 0 0 16px; }
  .signal { border-top: 1px solid var(--line); padding: 12px 0; }
  .signal .who { font-weight: 600; }
  .signal q { display: block; margin-top: 6px; font-style: italic; overflow-wrap: anywhere; }
  .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .empty { color: var(--muted); }
  .question { background: var(--card); border: 2px solid var(--human); border-radius: 12px; padding: 16px; margin: 0 0 24px; }
  .question .title { font-weight: 700; color: var(--human); margin-bottom: 4px; }
  .question form { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .question input { flex: 1 1 260px; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .question button { font: inherit; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--human); color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Knowledge clock · who still understands this?</p>
  <h1 id="headline">Loading…</h1>
  <p class="sub" id="sub"></p>
  <div id="question"></div>
  <div class="layout">
    <div class="topics" id="topics"></div>
    <aside class="detail" id="detail"><p class="empty">Pick a topic to see who reasoned about it, and why.</p></aside>
  </div>
</main>
<script>
const STATUS_LABEL = { dark: "Dark", single_point: "Single point", fading: "Fading", healthy: "Healthy" };
const ROLE_LABEL = { decided: "decided", corrected: "corrected Claude", explained_why: "explained why", answered_question: "answered a colleague", accepted_as_is: "let Claude handle it" };

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function day(iso) {
  return new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}

function clockText(t) {
  if (t.days_since === null) return "No human has ever reasoned about this";
  if (t.days_since === 0) return "A human reasoned about this today";
  return `Last human reasoning ${t.days_since} day${t.days_since === 1 ? "" : "s"} ago`;
}

function explain(t) {
  const people = t.reasoners.map(r => r.person);
  if (t.status === "dark") return `Claude handled this ${t.ai_count} time${t.ai_count === 1 ? "" : "s"}. No human has reasoned about it.`;
  if (t.status === "fading") return `Nobody has reasoned about this in ${t.days_since} days. Understanding is fading.`;
  if (t.status === "single_point") return `Only ${people[0]} has reasoned about this. If ${people[0]} is away, nobody can.`;
  return `${people.length} people reason about this: ${people.join(", ")}.`;
}

function bar(t) {
  const total = t.ai_count + t.human_count;
  const wrap = el("div");
  const b = el("div", "bar");
  const h = el("div", "h");
  h.style.width = total ? `${(100 * t.human_count) / total}%` : "0%";
  b.appendChild(h);
  wrap.appendChild(b);
  wrap.appendChild(el("div", "legend", `Claude on its own ${t.ai_count} · human reasoning ${t.human_count}`));
  return wrap;
}

async function showDetail(topic, button) {
  document.querySelectorAll(".topic").forEach(n => n.classList.toggle("selected", n === button));
  const res = await fetch(`/api/topics/${encodeURIComponent(topic)}`);
  const detail = document.getElementById("detail");
  detail.replaceChildren();
  if (!res.ok) { detail.appendChild(el("p", "empty", "This topic is gone. Reload the page.")); return; }
  const t = await res.json();
  const head = el("div", "row");
  head.appendChild(el("h2", null, t.topic));
  head.appendChild(el("span", `chip ${t.status}`, STATUS_LABEL[t.status]));
  detail.appendChild(head);
  detail.appendChild(el("p", "explain", explain(t)));
  detail.appendChild(bar(t));

  const human = t.signals.filter(s => s.certainty !== "ai");
  const ai = t.signals.length - human.length;
  if (!human.length) detail.appendChild(el("p", "empty", "No human reasoning recorded."));
  for (const s of human) {
    const item = el("div", "signal");
    const line = el("div");
    line.appendChild(el("span", "who", s.person));
    line.appendChild(document.createTextNode(` ${ROLE_LABEL[s.human_role]} · ${day(s.at)}`));
    line.appendChild(el("span", "tag", s.certainty));
    line.appendChild(el("span", "tag", s.source === "meeting" ? "meeting" : "Claude session"));
    item.appendChild(line);
    if (s.why) item.appendChild(el("q", null, s.why));
    detail.appendChild(item);
  }
  if (ai) detail.appendChild(el("p", "meta signal", `+ ${ai} request${ai === 1 ? "" : "s"} Claude handled without human reasoning`));
}

async function load() {
  const [summary, topics] = await Promise.all([fetch("/api/summary").then(r => r.json()), fetch("/api/topics").then(r => r.json())]);
  const h1 = document.getElementById("headline");
  h1.replaceChildren(
    document.createTextNode(`Claude handled ${summary.ai_count} requests on its own. `),
    el("span", "human", `Humans reasoned ${summary.human_count} times.`)
  );
  const s = summary.by_status;
  document.getElementById("sub").textContent =
    `${summary.topic_count} topics · ${s.dark} dark · ${s.single_point} single point · ${s.fading} fading · ${s.healthy} healthy · as of ${day(summary.now)}`;

  const list = document.getElementById("topics");
  list.replaceChildren();
  for (const t of topics) {
    const button = el("button", "topic");
    const row = el("div", "row");
    row.appendChild(el("span", "name", t.topic));
    row.appendChild(el("span", `chip ${t.status}`, STATUS_LABEL[t.status]));
    button.appendChild(row);
    const who = t.reasoners.length ? ` · ${t.reasoners.map(r => r.person).join(", ")}` : "";
    button.appendChild(el("div", "meta", clockText(t) + who));
    button.appendChild(bar(t));
    button.addEventListener("click", () => showDetail(t.topic, button));
    list.appendChild(button);
  }
}

async function loadQuestion() {
  const me = new URLSearchParams(location.search).get("me");
  const box = document.getElementById("question");
  box.replaceChildren();
  if (!me) return;
  const questions = await fetch(`/api/questions?person=${encodeURIComponent(me)}`).then(r => r.json());
  if (!questions.length) return;
  const q = questions[0];
  const card = el("div", "question");
  card.appendChild(el("div", "title", `${questions.length} question${questions.length === 1 ? "" : "s"} for you, ${me}`));
  card.appendChild(el("div", null, `On ${day(q.at)} you ${ROLE_LABEL[q.human_role]} about ${q.topic}, but nobody knows why. One line is enough.`));
  const form = el("form");
  const input = el("input");
  input.placeholder = "Why?";
  input.maxLength = 200;
  input.required = true;
  form.appendChild(input);
  form.appendChild(el("button", null, "Save"));
  form.addEventListener("submit", async event => {
    event.preventDefault();
    const res = await fetch("/api/why", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: q.id, why: input.value }) });
    if (res.ok) { await load(); await loadQuestion(); }
  });
  card.appendChild(form);
  box.appendChild(card);
}

load();
loadQuestion();
</script>
</body>
</html>
